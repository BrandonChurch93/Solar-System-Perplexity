<div style="width:100%;font-family:var(--font-sans)">
<div id="ln" style="font-size:13px;line-height:1.45;color:var(--color-text-primary);margin-bottom:8px"></div>
<div id="g" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
</div>
<script>
(function(){
var s=window.visualization&&window.visualization.sources&&window.visualization.sources.status,ln=document.getElementById('ln'),g=document.getElementById('g');
if(!s||s.error||!s.data||!s.data.pics){ln.textContent='Pictures could not be loaded.';return}
var d=s.data,n=d.pics.length,wide=d.pics.map(function(p){return !!p.wide||n==1});
(d.lines||[]).forEach(function(t){var p=document.createElement('div');p.textContent=t;ln.appendChild(p)});
function draw(){
g.innerHTML='';
d.pics.forEach(function(p,i){
var f=document.createElement('figure'),b=document.createElement('div'),m=document.createElement('img'),c=document.createElement('figcaption');
f.style.cssText='margin:0;min-width:0'+(wide[i]?';grid-column:1 / -1':'');
b.style.cssText='background:#050506;border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:'+(wide[i]?'zoom-out':'zoom-in')+(wide[i]?'':';height:236px');
m.src=p.src;m.alt=p.caption;m.style.cssText=wide[i]?'width:100%;display:block':'max-width:100%;max-height:236px;display:block';
c.textContent=p.caption;c.style.cssText='font-size:12px;line-height:1.35;color:var(--color-text-secondary);padding:4px 2px 0';
b.onclick=function(){wide[i]=!wide[i];draw()};
b.appendChild(m);f.appendChild(b);f.appendChild(c);g.appendChild(f)})}
draw()})();
</script>
